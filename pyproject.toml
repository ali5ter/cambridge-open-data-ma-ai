[project]
name = "cambridge-open-data-ma-ai"
version = "0.1.0"
description = "An MCP server, Skill, and tutorials for asking an AI agent to discover, fetch, cross-reference, and infer insights from the Cambridge MA Open Data Portal (Socrata, 280+ public datasets)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alister Lewis-Bowen", email = "alister@lewis-bowen.org" }]
keywords = [
    "cambridge",
    "open-data",
    "socrata",
    "mcp",
    "model-context-protocol",
    "duckdb",
    "civic-data",
    "ai-agent",
]
dependencies = [
    "duckdb>=1.5.5",
    "markdown>=3.10.3",
    "matplotlib>=3.11.1",
    "mcp>=1,<2",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[project.urls]
Homepage = "https://github.com/ali5ter/cambridge-open-data-ma-ai"
Documentation = "https://ali5ter.github.io/cambridge-open-data-ma-ai/"
Source = "https://github.com/ali5ter/cambridge-open-data-ma-ai"
Issues = "https://github.com/ali5ter/cambridge-open-data-ma-ai/issues"

[project.scripts]
cambridge-open-data-ma-mcp = "cambridge_data.mcp:main"
cambridge-data = "cambridge_data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cambridge_data"]

[dependency-groups]
dev = ["ruff>=0.14"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
